<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国矿山安全学会矿鸿联盟工作委员会主任委员、副主任委员选举</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 标题 */
        .header {
            text-align: center;
            padding: 45px 20px;
            background: linear-gradient(120deg, #001a4d 0%, #003399 45%, #0a4fc0 75%, #002a7a 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0, 60, 160, 0.45);
        }

        /* 标题上的流动光带 */
        .header::before {
            content: "";
            position: absolute;
            top: 0; left: -60%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(120, 200, 255, 0.20) 50%, transparent 100%);
            transform: skewX(-20deg);
            animation: headerGlow 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes headerGlow {
            0%   { left: -60%; }
            50%  { left: 110%; }
            100% { left: -60%; }
        }

        .header h1 {
            font-size: 1.7em;
            line-height: 1.5;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(120, 200, 255, 0.55), 0 0 4px rgba(255, 255, 255, 0.3);
        }

        /* 管理端按钮 - 灰色小按钮，放右边 */
        .admin-bar {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .admin-bar .bar-btns {
            display: flex;
            gap: 8px;
        }

        .admin-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
            background: #bdc3c7;
            color: #555;
        }
        .admin-btn:hover {
            background: #95a5a6;
            color: white;
        }

        /* 投票列表 - 紧凑布局 */
        .vote-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .vote-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
            cursor: pointer;
        }

        .vote-item:last-child { border-bottom: none; }
        .vote-item:hover { background: #f8f9fa; }

        .vote-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #2980b9;
            flex-shrink: 0;
        }

        .vote-info {
            flex: 1;
            display: flex;
            align-items: baseline;
            gap: 0;
        }

        /* 序号+姓名 列（固定宽度，制表位对齐） */
        .vote-name {
            font-size: 0.95em;
            font-weight: bold;
            color: #333;
            white-space: nowrap;
            width: 90px;
            flex-shrink: 0;
        }

        /* 推荐担任的职务标签（固定宽度，居中） */
        .vote-role {
            font-size: 0.75em;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(120deg, #001a4d 0%, #003399 45%, #0a4fc0 75%, #002a7a 100%);
            padding: 2px 10px;
            border-radius: 10px;
            white-space: nowrap;
            text-align: center;
            width: 96px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .vote-unit {
            font-size: 0.8em;
            color: #999;
            flex: 1;
        }

        /* 提交按钮区域 */
        .submit-area {
            text-align: center;
            padding: 20px;
        }

        .btn-submit {
            padding: 14px 50px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #2980b9 0%, #1a5276 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            max-width: 350px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(41, 128, 185, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            background: #27ae60;
        }

        .submit-hint {
            margin-top: 10px;
            font-size: 0.9em;
            color: #888;
        }

        /* 弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
            font-size: 1.3em;
        }

        .modal-close {
            float: right;
            font-size: 1.4em;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }
        .modal-close:hover { color: #333; }

        /* 二维码 */
        .qr-container {
            text-align: center;
            padding: 15px;
        }

        .qr-container img {
            max-width: 250px;
            width: 100%;
            border: 2px solid #eee;
            border-radius: 10px;
        }

        .qr-hint {
            margin-top: 12px;
            color: #666;
            font-size: 0.85em;
        }

        /* 结果统计 */
        .result-stats {
            margin-bottom: 15px;
            text-align: center;
        }

        .result-stats .stat {
            display: inline-block;
            margin: 0 12px;
            padding: 8px 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .result-stats .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #2980b9;
        }

        .result-stats .stat-label {
            font-size: 0.8em;
            color: #888;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
        }

        .result-table th,
        .result-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }

        .result-table th {
            background: #f8f9fa;
            font-weight: bold;
            color: #666;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2980b9 0%, #3498db 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .bar-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75em;
            font-weight: bold;
            color: #333;
        }

        /* 确认弹窗 */
        .confirm-modal {
            text-align: center;
            padding: 20px;
        }

        .confirm-modal p {
            margin-bottom: 15px;
            color: #555;
            line-height: 1.6;
        }

        .confirm-modal .warn {
            color: #e74c3c;
            font-weight: bold;
        }

        .confirm-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-confirm-yes {
            padding: 10px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-confirm-no {
            padding: 10px 30px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.3em; }
            .vote-item { padding: 8px 12px; }
            .vote-name { font-size: 0.9em; }
            .vote-unit { font-size: 0.75em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>🗳️ 中国矿山安全学会矿鸿联盟工作委员会<br>主任委员、副主任委员选举</h1>
        </div>

        <!-- 管理端按钮 - 灰色小按钮，靠右 -->
        <div class="admin-bar">
            <span style="font-size:0.85em;color:#888;">📅 2026年11月26日</span>
            <div class="bar-btns">
                <button class="admin-btn" onclick="showQRModal()">📱 投票二维码</button>
                <button class="admin-btn" onclick="showResultModal()">📊 投票结果</button>
            </div>
        </div>

        <!-- 投票列表 -->
        <div class="vote-list" id="voteList"></div>

        <!-- 提交按钮 -->
        <div class="submit-area">
            <button class="btn-submit" id="submitBtn" onclick="handleSubmitClick()">✅ 提交选票</button>
            <p class="submit-hint" id="submitHint">默认已全选，如需取消请点选对应选项</p>
        </div>
    </div>

    <!-- 二维码弹窗 -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal">
            <button class="modal-close" onclick="closeQRModal()">×</button>
            <h2>📱 投票二维码</h2>
            <div class="qr-container">
                <img id="qrImage" src="" alt="投票二维码">
                <p class="qr-hint">用微信或其他扫码工具扫描上方二维码即可投票</p>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <button class="modal-close" onclick="closeResultModal()">×</button>
            <h2>📊 投票结果</h2>
            <div class="result-stats" id="resultStats"></div>
            <table class="result-table">
                <thead>
                    <tr>
                        <th style="width:40px;">排名</th>
                        <th style="width:90px;">姓名</th>
                        <th style="width:50px;">票数</th>
                        <th>支持率</th>
                    </tr>
                </thead>
                <tbody id="resultBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 非全选确认弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal confirm-modal">
            <h2>⚠️ 确认提醒</h2>
            <p id="confirmText"></p>
            <div class="confirm-buttons">
                <button class="btn-confirm-no" onclick="closeConfirmModal()">返回修改</button>
                <button class="btn-confirm-yes" onclick="forceSubmitVote()">确认提交</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 候选人数据（7人·主任/副主任委员） ====================
        const candidates = [
            { role: '主任委员',   name: '吴海宇', unit: '华为矿山军团总裁' },
            { role: '副主任委员', name: '郝志伟', unit: '山西焦煤集团信息化管理部（大数据中心）部长' },
            { role: '副主任委员', name: '刘波',   unit: '云鼎科技股份有限公司董事长、总经理' },
            { role: '副主任委员', name: '宋振铎', unit: '中国中煤集团装备公司副总工程师、中煤装备研究院院长' },
            { role: '副主任委员', name: '徐辉',   unit: '内蒙古智能煤炭有限责任公司党委书记、董事长' },
            { role: '副主任委员', name: '陈海峰', unit: '鄂尔多斯市数投工业互联网有限公司总经理' },
            { role: '副主任委员', name: '杨霖',   unit: '华为终端三方使能产品线总经理' }
        ];

        const TOTAL = candidates.length;
        // 本选票独立的存储键，避免与委员选票(index.html)互相干扰
        const STORE_VOTES = 'votes2';
        const STORE_VOTED = 'hasVoted2';

        // ==================== 渲染投票列表 ====================
        function renderVoteList() {
            const listEl = document.getElementById('voteList');
            listEl.innerHTML = candidates.map((c, i) => `
                <label class="vote-item">
                    <input type="checkbox" id="cb_${i}" checked data-index="${i}">
                    <span class="vote-info">
                        <span class="vote-name">${i + 1}. ${c.name}</span>
                        <span class="vote-role">${c.role}</span>
                        <span class="vote-unit">${c.unit}</span>
                    </span>
                </label>
            `).join('');
        }

        // ==================== 提交逻辑 ====================
        function handleSubmitClick() {
            const checkboxes = document.querySelectorAll('.vote-item input[type="checkbox"]');
            let selectedCount = 0;
            checkboxes.forEach(cb => { if (cb.checked) selectedCount++; });

            if (selectedCount === 0) {
                alert('请至少选择一位候选人');
                return;
            }

            // 如果不是全选，弹出确认
            if (selectedCount < TOTAL) {
                showConfirmModal(selectedCount);
            } else {
                doSubmit();
            }
        }

        function showConfirmModal(selectedCount) {
            const unchecked = TOTAL - selectedCount;
            document.getElementById('confirmText').innerHTML = 
                `您已取消 <span class="warn">${unchecked}</span> 位候选人的勾选<br>` +
                `当前仅选择 <span class="warn">${selectedCount}</span> / ${TOTAL} 人<br><br>` +
                `请确认是否以此状态提交？`;
            document.getElementById('confirmModal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        function forceSubmitVote() {
            closeConfirmModal();
            doSubmit();
        }

        // ==================== 投票中转地址 (Cloudflare Worker) ====================
        const WORKER_URL = 'https://YOUR-WORKER.workers.dev';
        const FORM_KEY = 'deputy'; // deputy=主任副主任7人 -> votes2.json

        function doSubmit() {
            const checkboxes = document.querySelectorAll('.vote-item input[type="checkbox"]');
            const selected = [];
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    selected.push(candidates[parseInt(cb.dataset.index)].name);
                }
            });

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 正在提交…';

            fetch(WORKER_URL + '/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ selected, form: FORM_KEY })
            })
            .then(r => r.json())
            .then(res => {
                if (res && res.ok) {
                    localStorage.setItem(STORE_VOTED, 'true');
                    applyVotedState();
                } else {
                    btn.disabled = false;
                    btn.textContent = '✅ 提交选票';
                    alert('提交失败：' + (res && res.error ? res.error : '网络错误') + '\n请检查网络后重试');
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = '✅ 提交选票';
                alert('提交失败：' + err.message + '\n请检查网络后重试');
            });
        }

        // 应用"已投票"状态：禁用所有复选框 + 按钮变提示语
        function applyVotedState() {
            const btn = document.getElementById('submitBtn');
            btn.textContent = '✅ 您已投过票了，感谢您的参与！';
            btn.disabled = true;
            btn.style.background = '#27ae60';
            document.getElementById('submitHint').textContent = '';
            document.querySelectorAll('.vote-item input[type="checkbox"]').forEach(cb => cb.disabled = true);
        }

        // ==================== 二维码弹窗 ====================
        function showQRModal() {
            const url = window.location.href;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
            document.getElementById('qrImage').src = qrUrl;
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
        }

        // ==================== 结果弹窗 (读 GitHub votes2.json 全场实时汇总) ====================
        const VOTES_JSON = 'https://zodasa529.github.io/mineharmony-vote/votes2.json';

        function showResultModal() {
            document.getElementById('resultModal').classList.add('active');
            document.getElementById('resultStats').innerHTML = '<div class="stat"><div class="stat-value">…</div><div class="stat-label">加载中</div></div>';
            document.getElementById('resultBody').innerHTML = '';
            loadResults();
        }

        async function loadResults() {
            let votes = [];
            try {
                const r = await fetch(VOTES_JSON + '?t=' + Date.now());
                if (r.ok) votes = await r.json();
                if (!Array.isArray(votes)) votes = [];
            } catch (e) {
                votes = [];
            }
            renderResults(votes);
        }

        function renderResults(votes) {
            const totalVotes = votes.length;
            const countMap = {};
            candidates.forEach(c => countMap[c.name] = 0);
            votes.forEach(v => (v.selected || []).forEach(name => {
                if (countMap[name] !== undefined) countMap[name]++;
            }));
            const sorted = Object.entries(countMap).sort((a, b) => b[1] - a[1]);

            document.getElementById('resultStats').innerHTML = `
                <div class="stat">
                    <div class="stat-value">${totalVotes}</div>
                    <div class="stat-label">总投票人数</div>
                </div>
                <div class="stat">
                    <div class="stat-value">${candidates.length}</div>
                    <div class="stat-label">候选人总数</div>
                </div>
            `;

            document.getElementById('resultBody').innerHTML = sorted.map(([name, cnt], i) => {
                const pct = totalVotes > 0 ? ((cnt / totalVotes) * 100).toFixed(1) : '0.0';
                const barWidth = totalVotes > 0 ? (cnt / totalVotes) * 100 : 0;
                return `
                    <tr>
                        <td>${i + 1}</td>
                        <td><strong>${name}</strong></td>
                        <td>${cnt}</td>
                        <td>
                            <div class="bar-container">
                                <div class="bar-fill" style="width:${barWidth}%"></div>
                                <span class="bar-text">${pct}%</span>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        // ==================== 初始化 ====================
        renderVoteList();

        // 检查是否已投过票（同一设备防重复）
        if (localStorage.getItem(STORE_VOTED) === 'true') {
            applyVotedState();
        }
    </script>



</body></html>
